<!DOCTYPE html>
<html>
<head>
    <title>Credit Risk Assessment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Loan Application Form</h1>
    <p>Please provide your details for loan assessment.</p>


    <form action="/predict" method="POST">

        <h3>Personal Information</h3>

        <label>Age</label>
        <input type="number" name="age" required>


        <label>Annual Income</label>
        <input type="number" name="income" required>


        <label>Employment Length (Years)</label>
        <input type="number" name="employment" required>


        <label>Home Ownership</label>
       <select name="home">

       <option value="RENT">RENT</option>
       <option value="OWN">OWN</option>
      <option value="OTHER">OTHER</option>

</select>


        <h3>Loan Information</h3>


        <label>Loan Amount</label>
        <input type="number" name="loan_amount" required>


        <label>Loan Intent</label>

        <select name="intent">

<option value="EDUCATION">EDUCATION</option>
<option value="MEDICAL">MEDICAL</option>
<option value="PERSONAL">PERSONAL</option>
<option value="VENTURE">VENTURE</option>
<option value="HOMEIMPROVEMENT">HOMEIMPROVEMENT</option>

</select>



        <label>Loan Grade</label>

        <select name="loan_grade">

            <option value="1">A</option>
            <option value="2">B</option>
            <option value="3">C</option>
            <option value="4">D</option>
            <option value="5">E</option>
            <option value="6">F</option>
            <option value="7">G</option>

        </select>


        <label>Interest Rate (%)</label>
        <input type="number" step="0.01" name="interest" required>


        <label>Loan Percent Income</label>
        <input type="number" step="0.01" name="loan_percent" required>


        <label>Credit History Length</label>
        <input type="number" name="credit_history" required>


        <label>Previous Default?</label>

        <select name="default">

            <option value="Y">Yes</option>
            <option value="N">No</option>

        </select>


        <button type="submit">
            Submit Application
        </button>


    </form>


</div>


</body>
</html>
